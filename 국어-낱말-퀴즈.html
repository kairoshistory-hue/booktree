<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국어 낱말 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one ruled index card on a cool desk; the example sentence is the question, the blue word becomes a blank */
:root{
  --desk:#e7ebf0; --card:#fbfcfd; --ink:#1d2b4f; --muted:#64708a; --rule:#d3dbe8;
  --margin:#e3a0a6; --blue:#2754c5; --blue-bg:#e6edfb; --tag:#c9773a;
  --good:#1f8a5b; --good-bg:#e1f4ea; --bad:#c2413b; --bad-bg:#fbe6e4; --line:#c9d1de; --shade:#edf1f7;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#10151f; --card:#1a2130; --ink:#e4e9f4; --muted:#93a0b8; --rule:#2a3446;
  --margin:#7a3f47; --blue:#8fb0ff; --blue-bg:#1e2a48; --tag:#e3a06a;
  --good:#5fd39b; --good-bg:#143326; --bad:#f08a82; --bad-bg:#3a1c1b; --line:#334058; --shade:#232c3f; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#10151f; --card:#1a2130; --ink:#e4e9f4; --muted:#93a0b8; --rule:#2a3446;
  --margin:#7a3f47; --blue:#8fb0ff; --blue-bg:#1e2a48; --tag:#e3a06a;
  --good:#5fd39b; --good-bg:#143326; --bad:#f08a82; --bad-bg:#3a1c1b; --line:#334058; --shade:#232c3f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:18px}
header{display:grid;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.8rem;margin:0;text-wrap:balance}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cats button{display:grid;gap:2px;justify-items:start;text-align:left;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-family:var(--f-body);transition:border-color .15s,background .15s}
.cats button b{font-size:.98rem;color:var(--ink);word-break:keep-all;display:flex;gap:6px;align-items:center}
.cats button span{font:500 .75rem var(--f-body);font-variant-numeric:tabular-nums;word-break:keep-all}
.cats button span.done{color:var(--good)}
.cats button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg);box-shadow:inset 0 0 0 1px var(--blue)}
.cats button:focus-visible,.units button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.units{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.units button{display:grid;gap:1px;justify-items:center;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 4px;cursor:pointer;font-family:var(--f-body);transition:border-color .15s}
.units button:hover{border-color:var(--blue)}
.units button[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.units b{font-size:1rem}
.units small{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.units .st{font-style:normal;font-size:.72rem;font-weight:700;margin-top:3px;padding:1px 7px;border-radius:999px;background:var(--shade);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.units .st.done{background:var(--good-bg);color:var(--good)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--muted);font:500 .85rem var(--f-body);padding:6px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg button:focus-visible,.btn:focus-visible,.choices button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{position:relative;background:var(--card);border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,30,60,.45);
  padding:24px}
@media (max-width:440px){.card{padding:20px 18px}}
.meta{display:flex;justify-content:space-between;font:500 .78rem var(--f-mono);color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--rule);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.qbox{margin:20px 0 18px;background:var(--shade);border-radius:10px;padding:18px 20px}
@media (max-width:440px){.qbox{padding:16px}}
.tag{display:inline-block;margin-top:0;background:var(--tag);color:var(--card);font:700 .75rem var(--f-body);padding:2px 10px;border-radius:4px;letter-spacing:.04em}
.sentence{margin:12px 0 8px;font-family:var(--f-body);font-weight:500;letter-spacing:-.01em;font-size:clamp(1.15rem,4.4vw,1.4rem);line-height:1.8;word-break:keep-all;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--blue);color:var(--blue);text-align:center;padding:0 4px;line-height:1.3}
.blank.filled{background:var(--blue-bg);border-radius:4px 4px 0 0;font-weight:700}
.hintrow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0}
.hintbtn{border:0;background:none;color:var(--blue);font:500 .85rem var(--f-body);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hint{color:var(--muted);font-size:.92rem;word-break:keep-all}
.choices{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.choices button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:500 1.05rem/1.4 var(--f-body);letter-spacing:-.01em;cursor:pointer;transition:border-color .15s}
.choices button:hover:not(:disabled){border-color:var(--blue)}
.choices kbd{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none}
.choices button.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.choices button.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.choices button:disabled{cursor:default}
.typing{display:flex;gap:8px;flex-wrap:wrap}
.typing input{flex:1 1 200px;min-width:0;font:500 1.05rem var(--f-body);color:var(--ink);background:var(--desk);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.typing input.right{border-color:var(--good);background:var(--good-bg)}
.typing input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;min-height:42px;flex-wrap:wrap}
.feedback{font-weight:700;word-break:keep-all}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.feedback small{display:block;font-weight:500;color:var(--muted)}
.btn{border:0;border-radius:8px;background:var(--ink);color:var(--card);font:700 .95rem var(--f-body);padding:10px 18px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.result h2{font-family:var(--f-display);font-size:3.2rem;margin:18px 0 0;font-variant-numeric:tabular-nums}
.result>p{margin:4px 0 16px;color:var(--muted)}
.review{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:10px}
.review li{border-bottom:1px dashed var(--line);padding-bottom:8px;word-break:keep-all}
.review b{font-family:var(--f-display);color:var(--blue)}
.review div{font-size:.88rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
summary{cursor:pointer;font-weight:700}
details p{color:var(--muted);font-size:.85rem;margin:8px 0}
details code{font-family:var(--f-mono);background:var(--desk);padding:1px 5px;border-radius:4px;color:var(--ink)}
textarea{width:100%;min-height:260px;font:500 .82rem/1.7 var(--f-mono);color:var(--ink);background:var(--desk);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical;white-space:pre;overflow-x:auto}
.msg{font-size:.85rem;color:var(--muted)} .msg.err{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>국어 낱말 퀴즈</h1>
    <div class="cats" role="group" aria-label="출제 범위">
      <button id="k-word" aria-pressed="true"><b>어휘</b><span id="k-word-n"></span></button>
      <button id="k-phrase" aria-pressed="false"><b>속담·관용어</b><span id="k-phrase-n"></span></button>
      <button id="k-four" aria-pressed="false"><b>사자성어</b><span id="k-four-n"></span></button>
    </div>
    <div class="units" id="units" role="group" aria-label="어휘 회차"></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="문제 형식">
        <button id="t-mc" aria-pressed="true">객관식</button>
        <button id="t-sa" aria-pressed="false">주관식</button>
      </div>
    </div>
  </header>

  <section class="card" id="quiz" aria-live="polite">
    <div class="meta"><span id="count">1 / 10</span><span id="score">정답 0</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="qbox">
      <span class="tag" id="tag">어휘</span>
      <p class="sentence" id="sentence"></p>
      <div class="hintrow">
        <button class="hintbtn" id="hintbtn">뜻 보기</button>
        <span class="hint" id="hint" hidden></span>
      </div>
    </div>
    <ol class="choices" id="choices"></ol>
    <form class="typing" id="typing" hidden>
      <input id="answer" autocomplete="off" placeholder="빈칸에 들어갈 말" aria-label="빈칸에 들어갈 말">
      <button class="btn" id="check" type="submit">확인</button>
    </form>
    <div class="foot">
      <span class="feedback" id="feedback"></span>
      <button class="btn" id="next" hidden>다음 →</button>
    </div>
  </section>

  <section class="card result" id="result" hidden>
    <div class="meta"><span>결과</span><span id="r-mode"></span></div>
    <h2 id="r-score">0 / 0</h2>
    <p id="r-text"></p>
    <ul class="review" id="r-list"></ul>
    <div class="row">
      <button class="btn" id="retry-wrong">틀린 것만 다시</button>
      <button class="btn ghost" id="restart">이 회차 다시</button>
      <button class="btn ghost" id="next-unit" hidden>다음 회차 →</button>
    </div>
  </section>

  <details id="editor">
    <summary>문제 목록 편집</summary>
    <p>한 줄에 하나씩 <code>구분 | 낱말 | 뜻 | 예문</code> 형식으로 적어요. 예문에서 빈칸으로 만들 부분을 <code>[ ]</code>로 감싸 주세요. 구분은 낱말·속담·관용어·사자성어 중 하나예요. 어휘는 목록 순서대로 20문제씩 회차로 나뉘어요. 목록과 응시 기록은 이 브라우저에 저장됩니다.</p>
    <textarea id="words" spellcheck="false" aria-label="문제 목록"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="save">저장하고 새로 시작</button>
      <button class="btn ghost" id="reset">교재 내용으로 되돌리기</button>
      <button class="btn ghost" id="clear-status">응시 기록 지우기</button>
      <span class="msg" id="msg"></span>
    </div>
  </details>
</div>

<script>
const SAMPLE = `낱말 | 공학 | 공업의 이론, 기술, 생산 따위를 체계적으로 연구하는 학문 | 그 의자는 인체[공학]적인 설계를 통해 만들어졌다.
낱말 | 판서 | 고려 말기, 육조의 으뜸 벼슬 중 하나 | 홍길동의 아버지 홍 [판서]는 재주가 있는 홍길동이 뜻을 펴지 못함을 동정했다.
낱말 | 원자재 | 공업 생산의 원료가 되는 자재 | [원자재]의 가격이 오르면 자연히 생산품의 가격도 오른다.
낱말 | 발광 | 빛을 냄 | 반딧불이의 [발광]은 짝짓기를 수월하게 하기 위한 도구와 같다.
낱말 | 비범하다 | 보통 수준보다 훨씬 뛰어나다 | 최치원은 어려서부터 [비범한] 능력과 학식으로 유명했다.
속담 | 고기도 먹어 본 사람이 많이 먹는다 | 무슨 일이든지 늘 하던 사람이 더 잘한다는 말 | [고기도 먹어 본 사람이 많이 먹는다]고, 평소에 해봤으니 네가 더 잘하겠지.
낱말 | 개척민 | 어떤 지역을 개척하기 위하여 이주한 사람 | 신대륙에 도착한 [개척민]들은 첫 추수를 기념하였다.
낱말 | 영유권 | 일정한 영토에 대한 해당 국가의 관할권 | 독도의 [영유권]은 온전히 대한민국에 있다.
낱말 | 흑연 | 순수한 탄소로 이루어진 광물의 하나. 연필심의 재료 | [흑연]과 다이아몬드는 둘 다 탄소로 이루어져 있다.
낱말 | 후학 | 학문에서의 후배 | 스승님은 벼슬자리를 마다하시고 [후학]을 양성하러 시골로 내려가셨더랬지.
낱말 | 문하생 | 스승의 아래에서 가르침을 배우는 제자 | 나는 김 화백의 아래에서 [문하생]으로 오래도록 있었다.
사자성어 | 남녀노소 | 남자와 여자, 늙은이와 젊은이란 뜻으로, 모든 사람을 이르는 말 | 해가 떠오르자 [남녀노소] 새로운 해에 대한 기대감으로 소원을 빌었다.
낱말 | 고착 | 어떤 상황이나 현상이 굳어져 변하지 않음 | 전쟁이 [고착] 상태에 들어가자 연합군은 휴전을 제의하였다.
낱말 | 유원지 | 돌아다니며 구경하거나 놀기 위해 여러 가지 설비를 갖춘 곳 | 우리 가족은 방학 첫날 [유원지]에 가기로 약속했다.
낱말 | 대선 | 대통령을 뽑는 선거 | [대선]이 며칠 앞으로 다가오자 각 진영의 선거운동은 더욱 거세졌다.
낱말 | 하소연 | 억울한 일이나 잘못된 일, 딱한 사정 따위를 말함 | 억울한 백성들은 임금에게 사정을 [하소연]하기 위하여 신문고를 찾았다.
낱말 | 배선 | 전력을 쓰기 위하여, 전기 장치를 전선으로 연결하는 일 | 누전을 방지하려면 [배선] 상태를 자주 점검해야 한다.
관용어 | 빛을 발하다 | 제 능력이나 값어치를 드러내다 | 뒤늦게 배운 노래였지만 그녀는 무대에서 제대로 [빛을 발했다].
낱말 | 장의사 | 장례에 필요한 여러 일을 전문적으로 돕는 사람 | 사망 후 당사자의 SNS 기록을 지워주는 디지털 [장의사]라는 직업이 있다.
낱말 | 서평 | 책의 내용에 대한 평 | 이번 신간에 대한 [서평]은 굉장히 호의적이었다.
낱말 | 사원 | 종교를 믿는 신자들이 모여 예배 등을 하는 집 | 이슬람 신자들은 일정한 시간이 되면 [사원]이 있는 쪽으로 절을 한다.
낱말 | 건기 | 일 년 중 비가 적게 내려 건조한 시기 | 케냐의 [건기]는 6월과 10월로 밤에 매우 추워 위험하다.
낱말 | 우기 | 일 년 중 비가 많이 와 습한 시기 | 아프리카의 [우기]가 지나면 동물들이 서식지를 옮긴다.
사자성어 | 반신반의 | 얼마쯤 믿으면서도 한편으로는 의심함 | 그 말에 그녀는 [반신반의]하며 일이 어련히 알아서 잘됐겠거니 고개를 끄덕였다.
낱말 | 해발 | 해수면으로부터 계산하여 잰 육지나 산의 높이 | 에베레스트는 [해발]고도가 세계에서 가장 높은 산이다.
낱말 | 영구 | 어떤 상태가 시간상으로 무한히 이어짐 | [영구]적으로 인간이 죽지 않고 살 수는 없다.
낱말 | 유목 | 일정한 거처 없이 목축을 하며 돌아다니는 생활 | 몽골 사람들은 [유목] 생활을 하면서 가축을 키운다.
낱말 | 화첩 | 그림을 모아 엮은 책 | 미술관에서 김홍도의 [화첩]을 비롯한 다양한 작품을 전시하였다.
낱말 | 전열 | 전기 에너지를 열에너지로 변환시켰을 때 발생하는 열 | 전기장판과 난로 등은 [전열]기구 중 하나이다.

낱말 | 부임 | 임명이나 발령을 받아 근무할 곳으로 감 | 그는 흉흉한 소문이 돌아 아무도 가지 않으려던 철원 부사로 [부임]하였다.
낱말 | 혼절하다 | 정신이 아찔하여 까무러치다 | 아들의 죽음을 들은 김 할머니는 그만 [혼절하고] 말았다.
낱말 | 투박하다 | 말이나 행동 따위가 거칠고 세련되지 못하다 | 옹기는 [투박한] 모양과 색이지만 뛰어난 기능을 가졌다.
관용어 | 사족을 못 쓰다 | 무슨 일에 반하거나 혹하여 꼼짝하지 못하다 | 내 친구는 그저 야구라고는 [사족을 못 써] 경기를 놓치는 법이 없다.
낱말 | 펠트 | 양털이나 짐승의 털에 습기·열·압력을 가하여 만든 천 | 양모 [펠트]는 집에서 할 수 있는 취미 활동 중 하나다.
낱말 | 수효 | 낱낱의 수 | [수효]를 셀 수 없을 정도의 적이 새까맣게 몰려오기 시작했다.
낱말 | 감축 | 덜어서 줄임 | 지구온난화를 막기 위한 탄소 배출 [감축]안이 제정되었다.
낱말 | 매캐하다 | 연기나 곰팡이 따위의 냄새가 약간 맵고 싸하다 | 어디에서 불이 났는지 [매캐한] 연기가 스며들어왔다.
낱말 | 감지 | 느끼어 앎 | 자동문에 달린 센서는 사람을 자동으로 [감지]하여 문을 열어준다.
사자성어 | 대서특필 | 신문 따위의 출판물에서 어떤 기사에 큰 비중을 두어 다룸 | 언론들은 앞다투어 대통령의 발표를 [대서특필]하여 실었다.`;

const KEY = "korean-cloze-quiz-v1";
const $ = id => document.getElementById(id);
function load(){ try{ return localStorage.getItem(KEY) || SAMPLE }catch(e){ return SAMPLE } }
function store(t){ try{ localStorage.setItem(KEY,t) }catch(e){} }

function parse(text){
  const out = [];
  text.split(/\r?\n/).forEach(l=>{
    const p = l.split("|").map(s=>s.trim());
    if(p.length < 4) return;
    const [kind, word, mean] = p, sent = p.slice(3).join("|");
    const m = sent.match(/^(.*?)\[(.+?)\](.*)$/);
    if(!m || !word) return;
    const k = ["속담","관용어","사자성어"].includes(kind) ? kind : "낱말";
    // distractor group: 사자성어, 속담·관용어, 활용형(비범한·고동쳤다), 명사
    let g = k==="사자성어" ? "4" : k==="낱말" ? "n" : "p";
    if(k==="낱말" && m[2]!==word && /다$/.test(word) && !word.startsWith(m[2])) g = "v";
    out.push({kind:k, word, mean, pre:m[1], ans:m[2], post:m[3], g});
  });
  return out;
}
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const norm = s => s.replace(/[\s.,!?'"“”‘’]/g,"");

let items = parse(load()), type = "mc", queue = [], idx = 0, score = 0, wrong = [], answered = false;
const SET = 20, STATUS_KEY = "korean-cloze-status-v1";
const CATS = {word:["낱말"], phrase:["속담","관용어"], four:["사자성어"]};
let cat = "word", unitIdx = 0, isRetry = false;
let status = (()=>{ try{ return JSON.parse(localStorage.getItem(STATUS_KEY)) || {} }catch(e){ return {} } })();
function saveStatus(){ try{ localStorage.setItem(STATUS_KEY, JSON.stringify(status)) }catch(e){} }

function catItems(c){ return items.filter(w => CATS[c].includes(w.kind)) }
function wordSets(){ const w = catItems("word"), s = []; for(let i=0;i<w.length;i+=SET) s.push(w.slice(i,i+SET)); return s }
function unitKey(){ return cat==="word" ? "word-"+(unitIdx+1) : cat }
function unitItems(){ return cat==="word" ? (wordSets()[unitIdx] || []) : catItems(cat) }
function unitLabel(){ return cat==="word" ? `어휘 ${unitIdx+1}회` : cat==="phrase" ? "속담·관용어" : "사자성어" }
function fmtDate(d){ const t = new Date(d); return `${t.getMonth()+1}/${t.getDate()}` }
function stText(st){ return st ? `✓ ${st.s}/${st.t} · ${fmtDate(st.d)}` : "안 봄" }

function renderControls(){
  const sets = wordSets();
  if(unitIdx >= sets.length) unitIdx = Math.max(0, sets.length-1);
  ["word","phrase","four"].forEach(c=>{
    const b = $("k-"+c); b.setAttribute("aria-pressed", c===cat);
    const n = catItems(c).length, sp = $("k-"+c+"-n");
    if(c==="word"){
      const done = sets.filter((_,i)=>status["word-"+(i+1)]).length;
      sp.textContent = `${n}문제 · ${done}/${sets.length}회 완료`;
      sp.className = done===sets.length && sets.length ? "done" : "";
    } else {
      const st = status[c]; sp.textContent = `${n}문제 · ${st ? stText(st) : "안 봄"}`; sp.className = st ? "done" : "";
    }
  });
  const box = $("units"); box.hidden = cat!=="word"; box.innerHTML = "";
  sets.forEach((s,i)=>{
    const st = status["word-"+(i+1)], b = document.createElement("button");
    b.id = "u-"+(i+1); b.setAttribute("aria-pressed", i===unitIdx);
    const t = document.createElement("b"); t.textContent = `${i+1}회`;
    const r = document.createElement("small"); r.textContent = `${i*SET+1}–${i*SET+s.length}번`;
    const e = document.createElement("em"); e.className = "st" + (st ? " done" : ""); e.textContent = st ? `✓ ${st.s}/${st.t}` : "안 봄";
    b.title = st ? `${fmtDate(st.d)}에 봄 · ${st.s}/${st.t}` : "아직 안 봄";
    b.append(t,r,e); b.onclick = () => { unitIdx = i; renderControls(); start() };
    box.appendChild(b);
  });
}

function start(p){
  const pool = p || unitItems();
  if(!pool.length) return;
  isRetry = !!p;
  queue = shuffle(pool);
  idx = 0; score = 0; wrong = [];
  $("quiz").hidden = false; $("result").hidden = true;
  show();
}
function renderSentence(q, filled){
  const s = $("sentence"); s.textContent = "";
  s.append(q.pre);
  const b = document.createElement("span"); b.className = "blank" + (filled ? " filled" : "");
  b.textContent = filled ? q.ans : " "; s.append(b, q.post);
}
function show(){
  answered = false;
  const q = queue[idx];
  $("count").textContent = `${unitLabel()}${isRetry ? " 오답" : ""} · ${idx+1} / ${queue.length}`;
  $("score").textContent = `정답 ${score}`;
  $("bar").style.width = (idx/queue.length*100)+"%";
  $("tag").textContent = q.kind==="낱말" ? "어휘" : q.kind;
  renderSentence(q, false);
  $("hint").textContent = q.mean; $("hint").hidden = true; $("hintbtn").hidden = false;
  $("feedback").textContent = ""; $("feedback").className = "feedback"; $("next").hidden = true;
  const ol = $("choices"); ol.innerHTML = "";
  if(type === "mc"){
    ol.hidden = false; $("typing").hidden = true;
    const used = new Set([q.ans]);
    let pool = shuffle(items.filter(w=>w!==q && w.g===q.g));
    if(pool.length < 3) pool = pool.concat(shuffle(items.filter(w=>w!==q && w.g!==q.g)));
    const opts = [q];
    for(const w of pool){ if(opts.length===4) break; if(!used.has(w.ans)){ used.add(w.ans); opts.push(w) } }
    shuffle(opts).forEach((o,i)=>{
      const li = document.createElement("li"), b = document.createElement("button");
      b.id = "c"+i; b.dataset.ok = o===q ? "1" : "";
      const k = document.createElement("kbd"); k.textContent = i+1;
      const t = document.createElement("span"); t.textContent = o.ans;
      b.append(k,t); b.onclick = () => pickMC(b);
      li.appendChild(b); ol.appendChild(li);
    });
  } else {
    ol.hidden = true; $("typing").hidden = false;
    const inp = $("answer"); inp.value = ""; inp.className = ""; inp.disabled = false; $("check").disabled = false;
    inp.focus({preventScroll:true});
  }
}
function settle(ok){
  answered = true;
  const q = queue[idx], f = $("feedback");
  renderSentence(q, true);
  $("hint").hidden = false; $("hintbtn").hidden = true;
  if(ok){ score++; f.className = "feedback ok"; f.textContent = "정답!" }
  else {
    wrong.push(q); f.className = "feedback no"; f.textContent = `정답은 ‘${q.ans}’`;
    const sm = document.createElement("small"); sm.textContent = `표제어: ${q.word}`; f.appendChild(sm);
  }
  $("score").textContent = `정답 ${score}`;
  const n = $("next"); n.textContent = idx===queue.length-1 ? "결과 보기 →" : "다음 →"; n.hidden = false; n.focus();
}
function pickMC(b){
  if(answered) return;
  [...$("choices").querySelectorAll("button")].forEach(x=>{ x.disabled = true; if(x.dataset.ok) x.classList.add("right") });
  if(!b.dataset.ok) b.classList.add("wrong");
  settle(!!b.dataset.ok);
}
$("typing").addEventListener("submit", e=>{
  e.preventDefault(); if(answered) return;
  const inp = $("answer"), v = inp.value.trim(); if(!v) return;
  const q = queue[idx], ok = norm(v)===norm(q.ans) || norm(v)===norm(q.word);
  inp.className = ok ? "right" : "wrong"; inp.disabled = true; $("check").disabled = true;
  settle(ok);
});
function next(){ idx++; idx<queue.length ? show() : finish() }
function finish(){
  $("bar").style.width = "100%";
  $("quiz").hidden = true; $("result").hidden = false;
  if(!isRetry){ status[unitKey()] = {s:score, t:queue.length, d:Date.now()}; saveStatus(); renderControls() }
  $("r-score").textContent = `${score} / ${queue.length}`;
  $("r-mode").textContent = `${unitLabel()}${isRetry ? " 오답" : ""} · ${type==="mc" ? "객관식" : "주관식"}`;
  const r = score/queue.length;
  $("r-text").textContent = (r===1 ? "모두 맞혔어요." : r>=.7 ? "잘했어요. 틀린 문제만 한 번 더 풀어 보세요." : "틀린 문제를 다시 풀어 보세요.") + (isRetry ? "" : " 응시 기록을 남겼어요.");
  const ul = $("r-list"); ul.innerHTML = "";
  wrong.forEach(w=>{
    const li = document.createElement("li"), b = document.createElement("b"), d = document.createElement("div");
    b.textContent = w.word; d.textContent = w.pre + w.ans + w.post;
    li.append(b, document.createTextNode(` · ${w.mean}`), d); ul.appendChild(li);
  });
  $("retry-wrong").hidden = wrong.length===0;
  const nu = $("next-unit"), sets = wordSets();
  nu.hidden = !(cat==="word" && unitIdx < sets.length-1);
  if(!nu.hidden) nu.textContent = `어휘 ${unitIdx+2}회 보기 →`;
}
function press(groupIds, on){ groupIds.forEach(id=>$(id).setAttribute("aria-pressed", id===on)) }

["word","phrase","four"].forEach(c=>{ $("k-"+c).onclick = () => { cat = c; renderControls(); start() } });
$("t-mc").onclick = () => { type="mc"; press(["t-mc","t-sa"],"t-mc"); start() };
$("t-sa").onclick = () => { type="sa"; press(["t-mc","t-sa"],"t-sa"); start() };
$("hintbtn").onclick = () => { $("hint").hidden = false; $("hintbtn").hidden = true };
$("next").onclick = next;
$("restart").onclick = () => start();
$("next-unit").onclick = () => { unitIdx++; renderControls(); start() };
$("retry-wrong").onclick = () => start(wrong);
let clearArmed = false;
$("clear-status").onclick = () => {
  const b = $("clear-status");
  if(!clearArmed){ clearArmed = true; b.textContent = "한 번 더 누르면 지워져요"; setTimeout(()=>{ clearArmed=false; b.textContent="응시 기록 지우기" }, 4000); return }
  clearArmed = false; status = {}; saveStatus(); renderControls(); b.textContent = "응시 기록 지우기";
  $("msg").textContent = "응시 기록을 지웠어요"; $("msg").className = "msg";
};
$("save").onclick = () => {
  const list = parse($("words").value), msg = $("msg");
  if(list.length < 4){ msg.textContent = `읽을 수 있는 문제가 ${list.length}개예요. 형식을 확인하고 4개 이상 적어 주세요.`; msg.className="msg err"; return }
  items = list; store($("words").value); msg.textContent = `${list.length}문제 저장됨`; msg.className="msg"; renderControls(); start();
};
$("reset").onclick = () => { $("words").value = SAMPLE; $("save").onclick() };
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="TEXTAREA" || e.target.tagName==="INPUT" || $("quiz").hidden) return;
  if(!answered && type==="mc" && /^[1-4]$/.test(e.key)){ const b=$("c"+(e.key-1)); if(b) b.click() }
  else if(answered && e.key==="Enter" && document.activeElement!==$("next")) next();
});

$("words").value = load();
if(items.length < 4) items = parse(SAMPLE);
renderControls();
start();
</script>
